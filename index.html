<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Salt'n Pepper delivery is all over Lahore. Order your favourites online.">
    <link rel="stylesheet" href="style.css">
    <title>Salt'n Pepper | Free Delivery</title>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#" aria-label="Salt'n Pepper Restaurant home">
            <span class="brand-rule"></span>
            <span class="brand-name">Salt'n Pepper</span>
            <span class="brand-subtitle">Restaurant</span>
            <span class="brand-rule brand-rule-bottom"></span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#about">About Us</a>
            <a href="#publications">Publications</a>
            <a href="#branches">Branches</a>
        </nav>

        <div class="header-actions">
            <a class="account-link" href="#" aria-label="Your account">
                <span class="user-icon" aria-hidden="true"></span>
            </a>
            <a class="order-link" href="#order">Order Online <span aria-hidden="true">➜</span></a>
        </div>
    </header>

    <main class="hero" id="about">
        <div class="hero-copy">
            <p class="eyebrow">Hot, fresh &amp; at your door</p>
            <h1>FREE DELIVERY<br>ALL OVER <span>LAHORE</span></h1>
            <p class="hero-tagline">ANYTIME, ANYWHERE!</p>
            <a class="order-now" id="order" href="tel:+923155689645">
                <span class="order-dot" aria-hidden="true"></span> ORDER NOW
            </a>
        </div>

        <div class="delivery-scene" aria-label="Salt'n Pepper food delivery illustration" role="img">
            <div class="scene-glow"></div>
            <div class="road road-back"></div>
            <div class="rider">
                <div class="helmet"><span></span></div>
                <div class="rider-body"></div>
                <div class="rider-arm"></div>
                <div class="rider-leg rider-leg-back"></div>
                <div class="rider-leg rider-leg-front"></div>
            </div>
            <div class="scooter">
                <div class="scooter-handle"></div>
                <div class="scooter-body"></div>
                <div class="scooter-seat"></div>
                <div class="wheel wheel-back"></div>
                <div class="wheel wheel-front"></div>
            </div>
            <div class="delivery-box">
                <div class="box-top"></div>
                <div class="mini-brand">Salt'n Pepper<br><strong>Restaurant</strong></div>
                <div class="free-delivery">FREE DELIVERY</div>
                <div class="box-number">0315 568 9645</div>
            </div>
        </div>

        <div class="hero-contact">
            <span>FOR DELIVERY</span>
            <a href="tel:+923155689645">+92 315 568 9645</a>
        </div>
        <span class="slide-indicator" aria-hidden="true"></span>
    </main>
</body>
</html>
